<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reserva de Espacios Universitarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">Reserva de Espacios UNAB</span>
            </div>
        </nav>
    </header>

    <main class="container mb-5">

        <section id="seccion-filtros" class="mb-4">

            <!-- aqui van los filtros (Gabriel) -->

        </section>

        <section id="seccion-catalogo" class="mb-5">
            <h2 class="h4 mb-3 fw-bold">Espacios Disponibles</h2>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="contenedor-tarjetas"></div>

        </section>


        <section id="seccion-reservas" class="mb-4">

            <div class="modal fade" id="reg-modal" tabindex="-1" aria-laballedby="modal-title" aria-hidden="true">

                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modal-title">Hacer una reserva</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <!-- Datos para reservar -->
                        <div class="modal-body">
                            <p>Complete los siguientes datos para buscar disponibilidad.</p>
                            <div class="mb-3">
                                <label for="salaSeleccionada" class="form-label">Tipo de espacio requerido</label>
                                <input type="text" class="form-control" id="salaSeleccionada" readonly required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="Nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="Nombre" placeholder="Ej. Juan Perez"
                                        required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="modal-email" class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control" id="modal-email"
                                        placeholder="ejemplo@correo.com" required>
                                </div>
                            </div>
                            <!-- El edificio hay que colocar las opciones -->
                            <div class="mb-3">
                                <label for="edificioReserva" class="form-label">Edificio preferido</label>
                                <select class="form-select" id="edificioReserva" required>
                                    <!-- Esta es la única opción visible al principio -->
                                    <option value="" selected disabled>Seleccione un edificio...</option>
                                </select>
                                <!-- Mensaje de validación -->
                                <div class="invalid-feedback">Por favor seleccione un edificio válido.</div>
                            </div>

                            <!-- fehcasas-->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fechaReserva" class="form-label">Fecha</label>

                                    <input type="date" class="form-control" id="fechaReserva" required>
                                    <div class="invalid-feedback">Por favor indique la fecha.</div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="horaReserva" class="form-label">Horario</label>
                                    <!-- SELECCIÓN DE HORARIO -->
                                    <select class="form-select" id="horaReserva" required>
                                        <option value="" selected disabled>Seleccione un horario...</option>

                                    </select>
                                    <div class="invalid-feedback">Por favor seleccione un bloque horario.</div>
                                </div>
                            </div>


                            <div class="modal-footer px-0 pb-0 mt-3">
                                <button type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Reservar</button>
                            </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 small">&copy; 2026 Sistema de Reserva de Espacios Universitarios</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
